{% extends "base.html" %}{% block content %}<h1>👨‍🎓 Student Dashboard</h1><div class="banner"><b>{{user.name}}</b><br>🪪 Student ID: <b>{{user.student_id}}</b><br>👤 Username: <b>{{user.username}}</b><br>📚 Class: <b>{{user.class_name}}</b></div><h2>📚 Subjects</h2><div class="grid">{% for s in subjects %}<a class="card tile" href="{{url_for('subject',sid=s.id)}}">📚 <h3>{{s.name}}</h3></a>{% else %}<div class="card">No subjects yet.</div>{% endfor %}</div>{% endblock %}
