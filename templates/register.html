{% extends "base.html" %}{% block content %}<div class="card auth"><h1>📝 Student Registration</h1><form method="post"><input name="name" placeholder="Full Name" required><input name="username" placeholder="Username" required><input name="email" type="email" placeholder="Email" required><input name="phone" placeholder="Phone"><input name="parent_name" placeholder="Parent Name"><input name="parent_phone" placeholder="Parent Phone"><input name="roll_no" placeholder="Roll No"><select name="class_id" required><option value="">Select Class</option>{% for c in classes %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><input name="password" type="password" placeholder="Password" required><button>Register</button></form></div>{% endblock %}
