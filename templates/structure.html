{% extends "base.html" %}{% block content %}<h1>🏗️ Structure</h1><div class="card"><h2>➕ Add Chapter</h2><form class="inline" method="post" action="{{url_for('add_chapter')}}"><select name="subject_id" required><option value="">Subject</option>{% for s in subjects %}<option value="{{s.id}}">{{s.class_name}} → {{s.name}}</option>{% endfor %}</select><input name="name" placeholder="Chapter 1" required><button>Create Chapter + Drive Folder</button></form></div><div class="card"><h2>📂 Chapters / PDFs</h2>{% for ch in chapters %}<div class="row"><div><b>{{ch.class_name}} → {{ch.subject_name}} → {{ch.name}}</b><small>Drive: {{ch.drive_folder_id}}</small></div><a class="btn" href="{{url_for('manage_chapter',cid=ch.id)}}">📄 Manage PDFs</a></div>{% else %}<p>No chapters.</p>{% endfor %}</div>{% endblock %}
