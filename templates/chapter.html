{% extends "base.html" %}{% block content %}<h1>📂 {{data.name}}</h1><div class="card"><h2>📄 PDFs</h2>{% for d in documents %}<div class="row"><b>📄 {{d.name}}</b><span><a class="btn" target="_blank" href="{{url_for('view_document',did=d.id)}}">Read</a><a class="btn" href="{{url_for('download_document',did=d.id)}}">Download</a></span></div>{% else %}<p>No PDFs.</p>{% endfor %}</div>{% endblock %}
