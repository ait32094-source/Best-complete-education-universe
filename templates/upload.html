{% extends "base.html" %}{% block content %}<h1>📄 Manage PDFs</h1><div class="banner">{{chapter.class_name}} → {{chapter.subject_name}} → {{chapter.name}}</div><div class="card"><h2>📤 Upload PDF</h2><form method="post" enctype="multipart/form-data" action="{{url_for('upload',cid=chapter.id)}}"><input type="file" name="pdf" accept=".pdf,application/pdf" required><button>Upload PDF to Google Drive</button></form></div><div class="card"><h2>📚 Uploaded</h2>{% for d in documents %}<div class="row"><b>📄 {{d.name}}</b><form method="post" action="{{url_for('delete_document',did=d.id)}}"><button>Delete</button></form></div>{% else %}<p>No PDFs.</p>{% endfor %}</div>{% endblock %}
